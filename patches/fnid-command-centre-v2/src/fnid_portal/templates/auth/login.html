{% extends "base.html" %}
{% set hide_nav = true %}
{% block title %}FNID Login{% endblock %}

{% block content %}
<div class="min-vh-100 d-flex align-items-center justify-content-center" style="background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);">
    <div class="card card-fnid p-4" style="width: 400px; background: white;">
        <div class="text-center mb-4">
            <i class="bi bi-shield-shaded" style="font-size: 3rem; color: #0369a1;"></i>
            <h4 class="mt-2 fw-bold text-dark">FNID Command Centre</h4>
            <p class="text-muted small">Area 3 — Manchester, St. Elizabeth, Clarendon</p>
            <span class="sop-badge">JCF SOP Compliant</span>
        </div>

        <form id="login-form">
            <div class="mb-3">
                <label class="form-label text-muted small fw-bold">REGISTRATION NUMBER</label>
                <input type="text" class="form-control" id="reg_number" placeholder="e.g. CONST001" required>
            </div>
            <div class="mb-3">
                <label class="form-label text-muted small fw-bold">PASSWORD</label>
                <input type="password" class="form-control" id="password" required>
            </div>
            <div class="mb-3">
                <label class="form-label text-muted small fw-bold">MFA CODE (if enabled)</label>
                <input type="text" class="form-control" id="mfa_code" placeholder="6-digit code" maxlength="6">
            </div>
            <button type="submit" class="btn btn-fnid w-100 py-2 fw-bold">
                <i class="bi bi-box-arrow-in-right me-2"></i>SECURE LOGIN
            </button>
        </form>

        <div id="login-error" class="alert alert-danger mt-3 d-none small"></div>

        <div class="mt-3 text-center">
            <small class="text-muted">
                <i class="bi bi-lock-fill me-1"></i>Access restricted to authorized JCF personnel only
            </small>
        </div>
    </div>
</div>

<script>
document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorEl = document.getElementById('login-error');
    errorEl.classList.add('d-none');

    const data = {
        reg_number: document.getElementById('reg_number').value,
        password: document.getElementById('password').value,
        mfa_code: document.getElementById('mfa_code').value || null
    };

    try {
        const response = await fetch('/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });

        const result = await response.json();

        if (response.ok) {
            localStorage.setItem('access_token', result.access_token);
            localStorage.setItem('refresh_token', result.refresh_token);
            window.location.href = '/dashboard';
        } else {
            errorEl.textContent = result.message || 'Login failed';
            errorEl.classList.remove('d-none');
        }
    } catch (err) {
        errorEl.textContent = 'Network error. Please try again.';
        errorEl.classList.remove('d-none');
    }
});
</script>
{% endblock %}
