{% extends "base.html" %}
{% block title %}Session Expired{% endblock %}
{% block content %}
<div class="container py-5 text-center">
    <h1 class="display-1 text-warning">400</h1>
    <h2>Session Expired</h2>
    <p class="lead">Your form session has expired. Please go back, refresh the page, and try again.</p>
    <p class="text-muted">{{ reason }}</p>
    <a href="{{ url_for('main.home') }}" class="btn btn-primary mt-3">
        <i class="bi bi-house-door me-1"></i> Return to Dashboard
    </a>
</div>
{% endblock %}
