version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: fnid-postgres
    environment:
      POSTGRES_USER: fnid_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_in_production}
      POSTGRES_DB: fnid_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fnid_user -d fnid_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fnid-network

  # Redis Cache & Celery Broker
  redis:
    image: redis:7-alpine
    container_name: fnid-redis
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fnid-network

  # FNID Application
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: fnid-app
    environment:
      FLASK_ENV: production
      DATABASE_URL: postgresql://fnid_user:${POSTGRES_PASSWORD:-changeme_in_production}@postgres:5432/fnid_db
      REDIS_URL: redis://redis:6379/0
      FNID_SECRET_KEY: ${FNID_SECRET_KEY:-change-me-in-production}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
    ports:
      - "5000:5000"
    volumes:
      - app_uploads:/app/data/uploads
      - app_exports:/app/data/exports
      - app_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fnid-network
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: fnid-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - fnid-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  app_uploads:
  app_exports:
  app_logs:

networks:
  fnid-network:
    driver: bridge
